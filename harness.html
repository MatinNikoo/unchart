<!doctype html><html><head><meta charset="utf-8">
<script src="../vendor/tesseract.min.js"></script>
<script src="../src/engine.js"></script><script src="../src/ocr.js"></script></head><body>
<script>
const PATHS={workerPath:'/node_modules/tesseract.js/dist/worker.min.js',corePath:'/node_modules/tesseract.js-core/',langPath:'/node_modules/@tesseract.js-data/eng/4.0.0_best_int'};
async function load(src){const im=new Image();im.src=src;await im.decode();const c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0);return c}
window.run=async function(src){
  const c=await load(src);const t0=performance.now();
  const words=await UnchartOCR.readWords(c,PATHS);const t1=performance.now();
  const img=c.getContext('2d').getImageData(0,0,c.width,c.height);
  let res;try{res=Unchart.extract(img,words)}catch(e){res={ok:false,error:'crash '+e.message+' '+e.stack}}
  const t2=performance.now();
  const clean={ok:res.ok,error:res.error,dbg:res.dbg,flags:res.flags,axis:res.axis,rect:res.rect,ms_ocr:t1-t0,ms_extract:t2-t1,
    series:(res.series||[]).map(s=>({type:s.type,name:s.name,color:s.color,points:s.points.map(p=>({x:p.x,y:p.y,px:p.px,py:p.py}))})),
    words:words.map(w=>[w.text,Math.round(w.conf),Math.round(w.x0),Math.round(w.y0),Math.round(w.x1),Math.round(w.y1)])};
  return clean;
}
</script></body></html>
